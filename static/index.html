<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelBrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e4e2db;
  --accent: #0f6e5c; --accent-soft: #e2f1ec; --warn: #b4531a; --chip: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141513; --panel: #1d1f1c; --ink: #ecebe6; --muted: #9c9a92; --line: #2f322d;
    --accent: #4fc3a6; --accent-soft: #1f3530; --warn: #f0a070; --chip: #262924;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink);
  font-size: 15px; line-height: 1.55; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 20px 14px; background: var(--panel); }
.brand { font-weight: 700; font-size: 20px; margin: 0 6px 18px; }
.brand span { color: var(--accent); }
.new-btn { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; margin-bottom: 14px; }
.trip-link { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--ink);
  font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip-link:hover, .trip-link.active { background: var(--accent-soft); }
.trip-link small { display: block; color: var(--muted); font-size: 12px; }
main { padding: 32px 40px 80px; max-width: 980px; width: 100%; }
h1 { font-size: 28px; margin: 0 0 6px; } h2 { font-size: 19px; margin: 32px 0 12px; }
.lede { color: var(--muted); margin: 0 0 20px; }
.ask { display: flex; gap: 10px; }
textarea { flex: 1; resize: vertical; min-height: 56px; padding: 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
button.primary { padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent);
  color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: default; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.examples button { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.team { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 24px; }
.agent { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.agent .ico { font-size: 22px; } .agent .name { font-weight: 600; font-size: 14px; }
.agent .state { font-size: 12px; color: var(--muted); }
.agent.running { border-color: var(--accent); } .agent.running .state { color: var(--accent); }
.agent.done .state::before { content: "✓ "; color: var(--accent); }
.agent.failed .state { color: var(--warn); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: pulse 1s infinite alternate; margin-right: 4px; vertical-align: middle; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.facts span { background: var(--chip); border-radius: 99px; padding: 3px 11px; font-size: 13px; }
.assume { color: var(--muted); font-size: 13px; margin-top: 10px; }
.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 72px 1fr; gap: 14px; }
.day .num { font-weight: 700; font-size: 13px; color: var(--accent); }
.day .num small { display: block; color: var(--muted); font-weight: 400; }
.day h3 { margin: 0 0 6px; font-size: 16px; }
.day .slot { margin: 2px 0; } .day .slot b { font-weight: 600; color: var(--muted); font-size: 13px;
  display: inline-block; width: 78px; }
.day .tip { margin-top: 6px; font-size: 13px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; border-bottom: 0; }
td small { color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
  padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs button.on { background: var(--accent-soft); border-color: var(--accent); }
.md h1, .md h2, .md h3 { font-size: 15px; margin: 14px 0 6px; } .md p { margin: 6px 0; }
.md ul { padding-left: 20px; margin: 6px 0; } .md a { color: var(--accent); }
.sources { font-size: 12px; color: var(--muted); margin-top: 12px; }
.sources a { color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two ul { margin: 0; padding-left: 18px; }
.chat .msg { padding: 10px 14px; border-radius: 12px; margin: 8px 0; max-width: 90%; }
.chat .user { background: var(--accent-soft); margin-left: auto; }
.chat .assistant { background: var(--panel); border: 1px solid var(--line); }
.error { color: var(--warn); margin-top: 16px; }
.hidden { display: none !important; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 20px 16px 60px; }
  .team { grid-template-columns: repeat(2, 1fr); }
  .two { grid-template-columns: 1fr; }
  .ask { flex-direction: column; } button.primary { padding: 12px; }
  .day { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Travel<span>Brain</span></div>
    <button class="new-btn" onclick="newTrip()">+ New trip</button>
    <div id="tripList"></div>
  </aside>
  <main>
    <section id="intro">
      <h1>Where to next?</h1>
      <p class="lede">Describe your trip the way you'd tell a friend. A team of AI specialists will research flights, stays and weather, then build a plan.</p>
    </section>
    <form class="ask" id="askForm">
      <textarea id="prompt" placeholder="Plan a 10 day Europe trip from India in April, mid-range budget"></textarea>
      <button class="primary" id="goBtn">Plan it</button>
    </form>
    <div class="examples" id="examples"></div>

    <div class="team hidden" id="team"></div>
    <div class="error hidden" id="error"></div>

    <section id="result" class="hidden">
      <h2 id="planTitle"></h2>
      <div class="card"><div id="summary"></div><div class="facts" id="facts"></div><div class="assume" id="assume"></div></div>

      <h2>🗺️ Day by day</h2>
      <div class="days" id="days"></div>

      <h2>💰 Estimated budget</h2>
      <div class="card"><table id="budget"></table></div>

      <h2>🔎 Specialist reports</h2>
      <div class="tabs" id="tabs"></div>
      <div class="card md" id="report"></div>

      <div class="two" style="margin-top:12px">
        <div class="card"><b>🎒 Packing</b><ul id="packing"></ul></div>
        <div class="card"><b>✅ Booking checklist</b><ul id="checklist"></ul></div>
      </div>

      <h2>💬 Ask a follow-up</h2>
      <div class="chat" id="chat"></div>
      <form class="ask" id="chatForm">
        <textarea id="chatInput" placeholder="Swap Paris for Barcelona? What if we go in May instead?"></textarea>
        <button class="primary" id="chatBtn">Ask</button>
      </form>
    </section>
  </main>
</div>
<script>
const AGENTS = {
  intake:  ["🧭", "Intake"], flights: ["✈️", "Flights"], hotels: ["🏨", "Hotels"],
  weather: ["🌤️", "Weather"], planner: ["🗺️", "Planner"],
};
const EXAMPLES = [
  "Plan a 10 day Europe trip from India in April, mid-range budget",
  "Long weekend in Tokyo from Singapore for two foodies, luxury",
  "7 days in Bali from Mumbai in December on a budget, love beaches and hiking",
];
const $ = id => document.getElementById(id);
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current = null, activeTab = "flights";

EXAMPLES.forEach(t => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = t;
  b.onclick = () => { $("prompt").value = t; $("prompt").focus(); };
  $("examples").appendChild(b);
});

async function sseFetch(url, body, onEvent) {
  const res = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if (line.startsWith("data: ")) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

function renderTeam() {
  $("team").innerHTML = Object.entries(AGENTS).map(([k, [ico, name]]) =>
    `<div class="agent" id="agent-${k}"><div class="ico">${ico}</div><div class="name">${name}</div><div class="state">Waiting</div></div>`).join("");
  $("team").classList.remove("hidden");
}
function setAgent(k, state, label) {
  const el = $("agent-" + k); if (!el) return;
  el.className = "agent " + state;
  el.querySelector(".state").innerHTML = state === "running" ? '<span class="dot"></span>Researching…' : (label || "Done");
}

$("askForm").onsubmit = async e => {
  e.preventDefault();
  const prompt = $("prompt").value.trim(); if (!prompt) return;
  $("goBtn").disabled = true; $("error").classList.add("hidden"); $("result").classList.add("hidden");
  renderTeam();
  try {
    await sseFetch("/api/plan", { prompt }, ev => {
      if (ev.type === "status") setAgent(ev.agent, ev.state);
      else if (ev.type === "report") setAgent(ev.agent, ev.error ? "failed" : "done", ev.error ? "Couldn't finish" : "Done");
      else if (ev.type === "error") showError(ev.message);
      else if (ev.type === "plan") { current = { ...ev, request: ev.trip, messages: [] }; showTrip(current); loadTrips(); }
    });
  } catch (err) { showError(err.message); }
  $("goBtn").disabled = false;
};

function showError(msg) {
  document.querySelectorAll(".agent.running").forEach(el => setAgent(el.id.slice(6), "failed", "Stopped"));
  $("error").textContent = "⚠️ " + msg; $("error").classList.remove("hidden"); }

function money(n, cur) {
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n); }
  catch { return `${cur} ${Math.round(n).toLocaleString()}`; }
}

function showTrip(t) {
  const p = t.plan, r = t.request;
  $("intro").classList.add("hidden");
  $("planTitle").textContent = p.title;
  $("summary").textContent = p.summary;
  $("facts").innerHTML = [
    `📍 ${r.cities.join(" → ")}`, `📅 ${r.start_date} – ${r.end_date}`, `🗓️ ${r.days} days`,
    `👥 ${r.travelers} traveller${r.travelers > 1 ? "s" : ""}`, `💳 ${r.budget_level}`, `🛫 from ${r.origin}`,
  ].map(f => `<span>${esc(f)}</span>`).join("");
  $("assume").textContent = r.assumptions?.length ? "Assumed: " + r.assumptions.join(" · ") : "";
  $("days").innerHTML = p.itinerary.map(d => `
    <div class="card day"><div class="num">DAY ${d.day}<small>${esc(d.date)}</small><small>${esc(d.city)}</small></div>
    <div><h3>${esc(d.title)}</h3>
      <div class="slot"><b>Morning</b>${esc(d.morning)}</div>
      <div class="slot"><b>Afternoon</b>${esc(d.afternoon)}</div>
      <div class="slot"><b>Evening</b>${esc(d.evening)}</div>
      ${d.tip ? `<div class="tip">💡 ${esc(d.tip)}</div>` : ""}</div></div>`).join("");
  const c = p.budget.currency;
  $("budget").innerHTML = `<tr><th>Category</th><th class="num">Low</th><th class="num">High</th></tr>` +
    p.budget.items.map(i => `<tr><td>${esc(i.category)}<br><small>${esc(i.note)}</small></td><td class="num">${money(i.low, c)}</td><td class="num">${money(i.high, c)}</td></tr>`).join("") +
    `<tr class="total"><td>Total</td><td class="num">${money(p.budget.total_low, c)}</td><td class="num">${money(p.budget.total_high, c)}</td></tr>`;
  $("packing").innerHTML = p.packing.map(x => `<li>${esc(x)}</li>`).join("");
  $("checklist").innerHTML = p.booking_checklist.map(x => `<li>${esc(x)}</li>`).join("");
  renderTabs();
  $("chat").innerHTML = ""; (t.messages || []).forEach(m => addMsg(m.role, m.content));
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
}

function renderTabs() {
  const names = Object.keys(current.reports);
  if (!names.includes(activeTab)) activeTab = names[0];
  $("tabs").innerHTML = names.map(n => `<button type="button" class="${n === activeTab ? "on" : ""}" onclick="activeTab='${n}';renderTabs()">${AGENTS[n]?.[0] || ""} ${AGENTS[n]?.[1] || n}</button>`).join("");
  const rep = current.reports[activeTab];
  const src = (rep.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`).join(" · ");
  $("report").innerHTML = md(rep.report) + (src ? `<div class="sources">Sources: ${src}</div>` : "");
}

function addMsg(role, text) {
  const el = document.createElement("div"); el.className = "msg md " + role;
  el.innerHTML = role === "user" ? esc(text) : md(text);
  $("chat").appendChild(el); return el;
}

$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const msg = $("chatInput").value.trim(); if (!msg || !current?.id) return;
  $("chatInput").value = ""; $("chatBtn").disabled = true;
  addMsg("user", msg);
  const el = addMsg("assistant", "…"); let text = "";
  try {
    await sseFetch(`/api/trips/${current.id}/chat`, { message: msg }, ev => {
      if (ev.type === "delta") { text += ev.text; el.innerHTML = md(text); }
      else if (ev.type === "error") el.innerHTML = `<span class="error">⚠️ ${esc(ev.message)}</span>`;
    });
  } catch (err) { el.innerHTML = `<span class="error">⚠️ ${esc(err.message)}</span>`; }
  $("chatBtn").disabled = false;
};

async function loadTrips() {
  const trips = await (await fetch("/api/trips")).json();
  $("tripList").innerHTML = trips.map(t => `<a class="trip-link ${current?.id === t.id ? "active" : ""}" onclick="openTrip('${t.id}')">${esc(t.title)}<small>${new Date(t.created_at).toLocaleDateString()}</small></a>`).join("")
    || `<div style="color:var(--muted);font-size:13px;padding:0 8px">Your saved trips will appear here.</div>`;
}
async function openTrip(id) {
  current = await (await fetch(`/api/trips/${id}`)).json();
  $("team").classList.add("hidden"); $("error").classList.add("hidden");
  showTrip(current); loadTrips();
}
function newTrip() {
  current = null; $("result").classList.add("hidden"); $("team").classList.add("hidden");
  $("intro").classList.remove("hidden"); $("prompt").value = ""; $("prompt").focus(); loadTrips();
  window.scrollTo({ top: 0 });
}
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("askForm").requestSubmit(); });
loadTrips();
</script>
</body>
</html>
